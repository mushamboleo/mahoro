<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    .all {
      padding: 30px;
      display: flex;
      flex-direction: column;
      
      width:35%;
      
    }
    .header h1 {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
      font-weight: bold;
    }
    .header p {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
    }
    .card {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
    }
    .card .card-image {
      border: 1px solid rgba(0, 0, 0, 0.3);

    }

    .content {
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 5px;
      display: flex;
      border: 1px solid rgba(0, 0, 0, 0.3);

      flex-direction: column;
      row-gap: 5px;
    }
  </style>
  <body>
    <div class="all">
      <div class="header">
        <h1>Online services</h1>
        <p>The following are the online services offered:</p>
      </div>
      <div>
      <div class="card">
        <div class="card-image">
          <img src="eLearning_Logo.png" />
        </div>
        <div class="content">
          <div class="content-header">
            <h2>eLearning platform</h2>
          </div>
          <div class="content-paragraph">
            <p>Rwanda Polytechnic eLearning platform</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
</div></div>
